apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rms-dev

resources:
  - namespace.yaml
  - ../../base

# Dev owns a MUTABLE tag of its own. This is the tag you are meant to
# overwrite: `run.bat k8s-build dev` rebuilds it from the working tree,
# and because production asks for :1.1.0 and qs for :qs, nothing you
# break here can reach either of them.
images:
  - name: ammaartech/predictive-resource-monitor
    newTag: "dev"

# One pod. Dev is for reading a change back, not for staying up.
replicas:
  - name: dashboard
    count: 1

labels:
  - pairs:
      environment: dev
    includeSelectors: false

patches:
  - path: patch-service.yaml
  - path: patch-deployment.yaml
