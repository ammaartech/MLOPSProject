# ======================================================================
#  Predictive Resource Monitoring System
#
#      docker compose up dashboard mlflow        the two UIs
#      docker compose run --rm app pipeline      all twelve stages, once
#      docker compose run --rm app drift         drift monitor + retrain
#      docker compose --profile live up          continuous scheduler
#
#  Every service shares two bind-mounted directories: ./dataset, holding
#  the collected metrics.db, and ./data, holding mlflow.db and the
#  serialised models. Bind-mounted rather than named volumes on purpose:
#  the collected samples and the promotion history are the evidence this
#  project rests on, and they must stay visible to the Windows tooling
#  (run.bat, the .venv) that also reads them.
#
#  Because both sides open the SAME metrics.db, a container run and a host
#  run produce identical data and config fingerprints. That is what makes
#  "Docker reproduces the host results exactly" a checkable claim rather
#  than a hopeful one, so do not replace these with named volumes.
# ======================================================================

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: ammaartech/predictive-resource-monitor:latest
  volumes:
    - ./data:/app/data
    # The collected metrics. Excluded from the image by .dockerignore, so
    # without this mount the container starts on an empty database and
    # every result differs from the host's.
    - ./dataset:/app/dataset
    # MLflow's artifact root for a SQLite backend is ./mlruns relative to
    # the working directory. Without this mount the run metadata persists
    # and the logged model files silently do not.
    - ./mlruns:/app/mlruns
  environment:
    RESOURCE_MONITOR_DATA: /app/data
    # Redundant with config.py's default (BASE_DIR is /app), and stated
    # anyway: the fingerprint parity above depends on this path matching
    # the mount, and an accidental divergence fails silently by creating
    # a second, empty database.
    RESOURCE_MONITOR_DB_DIR: /app/dataset
  # SQLite over a Windows bind mount goes through virtiofs, where WAL's
  # shared-memory file is unreliable. connection.py sets busy_timeout, and
  # this keeps a stalled writer from wedging a whole compose run.
  stop_grace_period: 15s

services:

  # One-shot verbs: pipeline, drift, menu, backtest, shell.
  # Started only via `docker compose run`, never by `up`.
  app:
    <<: *common
    profiles: ["tools"]
    stdin_open: true
    tty: true

  dashboard:
    <<: *common
    container_name: rms-dashboard
    command: ["dashboard"]
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mlflow:
    <<: *common
    container_name: rms-mlflow
    command: ["mlflow"]
    ports:
      - "5000:5000"
    restart: unless-stopped

  # The continuous loop — the "continuously analyses" clause of the brief.
  # --with-collector is deliberately omitted: see the note in collector.
  scheduler:
    <<: *common
    container_name: rms-scheduler
    profiles: ["live"]
    command: ["schedule", "--drift-every", "10"]
    restart: unless-stopped

  # Samples THIS CONTAINER, not the Windows host. A Linux container cannot
  # see Windows' CPU or memory — psutil reads /proc, which belongs to the
  # Docker Desktop VM. Useful for demonstrating the collector end to end;
  # for data you intend to model, run `run.bat collect` on the host.
  collector:
    <<: *common
    container_name: rms-collector
    profiles: ["live"]
    command: ["collect"]
    restart: unless-stopped
