# ======================================================================
#  Dashboard theme.
#
#  This file is the single source of the visual system. Streamlit applies
#  it to every widget, table, metric and chart, so nothing below needs to
#  be repeated in app.py — and a colour that is not here should not exist
#  in the app.
#
#  Light only, by decision: the dashboard is read in meeting rooms and on
#  projectors, where a dark surface loses the low-contrast series first.
#
#  The chart colours are not a taste choice. They are the reference
#  palette from the data-viz method, and they were run through its
#  validator against this exact surface (#ffffff) before being pasted
#  here: lightness band, chroma floor, colour-blind separation and
#  normal-vision separation all PASS. Two hand-picked "more corporate"
#  alternatives were tried first and both FAILED — green vs red measured
#  ΔE 1.2 under deuteranopia, i.e. indistinguishable. If you change these,
#  re-run the validator; do not eyeball it.
# ======================================================================

[theme]
base = "light"

# ---------------------------------------------------------------- colour
primaryColor            = "#1c5cab"   # actions, focus rings, active tab
backgroundColor         = "#ffffff"   # the chart surface the palette was validated against
secondaryBackgroundColor = "#f4f5f7"  # sidebar, widget fills, table header
textColor               = "#111418"
linkColor               = "#1c5cab"
borderColor             = "#e3e6ea"
dataframeBorderColor    = "#e3e6ea"
dataframeHeaderBackgroundColor = "#f4f5f7"
codeBackgroundColor     = "#f4f5f7"
codeTextColor           = "#1f3a5f"
showWidgetBorder        = true

# Streamlit's semantic colours, pulled onto the method's status palette so
# an st.warning and a WARN row in a table are the same yellow.
greenColor  = "#0ca30c"
yellowColor = "#fab219"
orangeColor = "#ec835a"
redColor    = "#d03b3b"
blueColor   = "#2a78d6"
violetColor = "#4a3aa7"
grayColor   = "#898781"

# ------------------------------------------------------------ typography
# One scale, six steps, used everywhere. 15px root keeps dense tables
# readable without the app feeling like a phone.
font         = "sans-serif"
codeFont     = "monospace"
baseFontSize = 15
baseFontWeight = 400

#                     h1       h2        h3      h4         h5          h6
headingFontSizes   = ["1.5rem", "1.15rem", "1rem", "0.9375rem", "0.875rem", "0.8125rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

metricValueFontSize   = "1.5rem"
metricValueFontWeight = 600
codeFontSize          = "0.8125rem"

# ---------------------------------------------------------------- shape
baseRadius   = "0.25rem"
buttonRadius = "0.25rem"

# ---------------------------------------------------------------- charts
# Categorical: fixed order, assigned by slot, never cycled. Validated
# against #ffffff — worst adjacent CVD ΔE 9.1, worst normal-vision ΔE 19.6.
chartCategoricalColors = [
  "#2a78d6",  # 1 blue
  "#eb6834",  # 2 orange
  "#1baf7a",  # 3 aqua
  "#eda100",  # 4 yellow
  "#e87ba4",  # 5 magenta
  "#008300",  # 6 green
  "#4a3aa7",  # 7 violet
  "#e34948",  # 8 red
]

# Sequential: one hue, light to dark. Exactly ten steps or Streamlit
# discards the list and falls back to its own.
chartSequentialColors = [
  "#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec",
  "#5598e7", "#3987e5", "#2a78d6", "#1c5cab", "#104281",
]

# Diverging: two poles that read as opposite, neutral through the middle.
chartDivergingColors = [
  "#0d366b", "#1c5cab", "#3987e5", "#86b6ef", "#dce7f2",
  "#f5e0df", "#efa9a8", "#e34948", "#c02f2f", "#8f2020",
]

[theme.sidebar]
backgroundColor          = "#f7f8fa"
secondaryBackgroundColor = "#eceef1"
borderColor              = "#e3e6ea"
showWidgetBorder         = true

[client]
toolbarMode = "minimal"

[server]
runOnSave = false
